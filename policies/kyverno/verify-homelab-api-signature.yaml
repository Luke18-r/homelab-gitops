apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-homelab-api-signature
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-homelab-api-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/luke18-r/homelab-api*"
          mutateDigest: false
          required: true
          verifyDigest: true
          failureAction: Enforce
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/luke18-r/homelab-api/.github/workflows/build-sign-push.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"
