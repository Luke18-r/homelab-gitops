apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-homelab-api-signature
spec:
  validationFailureAction: Audit
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-homelab-api-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/luke18-r/homelab-api*"
          mutateDigest: false
          required: true
          verifyDigest: true
          failureAction: Audit
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "pitigoilucian18@gmail.com"
                    issuer: "https://github.com/login/oauth"
                    rekor:
                      url: "https://rekor.sigstore.dev"
